services:
  redis:
    image: redis:7-alpine
    container_name: rag-agent-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 64M
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: rag-agent-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-raguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-raguser} -d ${DB_NAME:-ragdb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.50'
          memory: 512M
        limits:
          cpus: '2.00'
          memory: 2G

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rag-agent-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-raguser}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ragdb}
      API_OPEN_AI: ${API_OPEN_AI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CORPUS_ID: ${GEMINI_CORPUS_ID}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      TURN_SECRET: ${TURN_SECRET:-krishna1284radharamat145698uhgg}
      TURN_HOST: ${TURN_EXTERNAL_IP:-45.150.9.229}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      FFMPEG_PATH: /usr/bin/ffmpeg
      VIDEO_UPLOAD_MAX_SIZE: ${VIDEO_UPLOAD_MAX_SIZE:-2147483648}
      CDN_ENABLED: ${CDN_ENABLED:-false}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      ROOM_SFU_ENABLED: ${ROOM_SFU_ENABLED:-false}
      ROOM_SFU_PROVIDER: ${ROOM_SFU_PROVIDER:-livekit}
      ROOM_SFU_REQUIRE_MEMBERSHIP: ${ROOM_SFU_REQUIRE_MEMBERSHIP:-true}
      ROOM_SFU_MAX_PARTICIPANTS: ${ROOM_SFU_MAX_PARTICIPANTS:-50}
      ROOM_SFU_MAX_SUBSCRIPTIONS: ${ROOM_SFU_MAX_SUBSCRIPTIONS:-9}
      ROOM_SFU_VIDEO_PRESET: ${ROOM_SFU_VIDEO_PRESET:-balanced}
      ROOM_SFU_DYNACAST_ENABLED: ${ROOM_SFU_DYNACAST_ENABLED:-true}
      ROOM_SFU_ADAPTIVE_STREAM_ENABLED: ${ROOM_SFU_ADAPTIVE_STREAM_ENABLED:-true}
      ROOM_SFU_SIMULCAST_ENABLED: ${ROOM_SFU_SIMULCAST_ENABLED:-true}
      ROOM_SFU_TOKEN_TTL_MINUTES: ${ROOM_SFU_TOKEN_TTL_MINUTES:-15}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL}
      FF_REDIS_RATE_LIMIT: ${FF_REDIS_RATE_LIMIT:-false}
      FF_HTTP_CONDITIONAL_CACHE: ${FF_HTTP_CONDITIONAL_CACHE:-false}
      FF_CONTACTS_LEGACY_MODE: ${FF_CONTACTS_LEGACY_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.50'
          memory: 512M
        limits:
          cpus: '2.00'
          memory: 1536M

  feed-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rag-agent-feed-worker
    command: ["./feed-worker"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-raguser}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ragdb}
      FEED_WORKER_ENABLED: ${FEED_WORKER_ENABLED:-true}
      FEED_REBUILD_INTERVAL_SEC: ${FEED_REBUILD_INTERVAL_SEC:-300}
      FEED_REBUILD_LIMIT: ${FEED_REBUILD_LIMIT:-120}
      FEED_REBUILD_BATCH_SIZE: ${FEED_REBUILD_BATCH_SIZE:-200}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 128M
        limits:
          cpus: '1.00'
          memory: 512M

  media-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rag-agent-media-worker
    command: ["./media-worker"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-raguser}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ragdb}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      MEDIA_WORKER_ENABLED: ${MEDIA_WORKER_ENABLED:-true}
      MEDIA_WORKER_INTERVAL_SEC: ${MEDIA_WORKER_INTERVAL_SEC:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 128M
        limits:
          cpus: '1.00'
          memory: 512M

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: rag-agent-admin
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 128M
        limits:
          cpus: '1.00'
          memory: 512M

  lkm:
    build:
      context: ./lkm
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: rag-agent-lkm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 128M
        limits:
          cpus: '1.00'
          memory: 512M

  coturn:
    image: coturn/coturn
    container_name: rag-agent-turn
    restart: always
    network_mode: host # For better performance and NAT handling in production
    environment:
      - LOGGING_LEVEL=N
      - USERS=${TURN_USER}:${TURN_PASSWORD}
      - REALM=${TURN_REALM:-vedamatch.ru}
      - LISTENING_PORT=3478
      - MIN_PORT=49152
      - MAX_PORT=49162
      - EXTERNAL_IP=${TURN_EXTERNAL_IP:-45.150.9.229}
      - STATIC_AUTH_SECRET=${TURN_SECRET}

  livekit:
    image: livekit/livekit-server:latest
    container_name: rag-agent-livekit
    restart: unless-stopped
    profiles: ["sfu"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS}
      - LIVEKIT_PORT=7880
      - LIVEKIT_LOG_LEVEL=info
      - LIVEKIT_REGION=ru
      - LIVEKIT_NODE_IP=${LIVEKIT_NODE_IP}
      - LIVEKIT_USE_EXTERNAL_IP=true
    deploy:
      resources:
        reservations:
          cpus: '1.00'
          memory: 512M
        limits:
          cpus: '3.00'
          memory: 2G

volumes:
  postgres_data:
  redis_data:
