server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    pipeline_stages:
      - docker: {}
      - static_labels:
          job: docker-containers
          host: vedamatch-prod
          cluster: vedamatch-prod
          environment: production
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: '/?(vedamatch-.*|dokploy-traefik)(\\..*)?'
        action: keep
      - source_labels:
          - __meta_docker_container_name
        regex: '/?(.*)'
        target_label: container
        replacement: '$1'
      - source_labels:
          - __meta_docker_container_label_com_docker_swarm_service_name
        target_label: service
      - source_labels:
          - __meta_docker_container_label_com_docker_swarm_task_name
        target_label: task
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - source_labels:
          - __meta_docker_container_id
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
      - target_label: job
        replacement: docker-containers
      - target_label: host
        replacement: vedamatch-prod
      - target_label: cluster
        replacement: vedamatch-prod
      - target_label: environment
        replacement: production

  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        host: vedamatch-prod
    pipeline_stages:
      - static_labels:
          job: systemd-journal
          host: vedamatch-prod
          cluster: vedamatch-prod
          environment: production
    relabel_configs:
      - source_labels:
          - __journal__systemd_unit
        regex: '(ssh|sshd|docker|containerd|fail2ban|ufw).*'
        action: keep
      - source_labels:
          - __journal__systemd_unit
        target_label: unit
      - target_label: environment
        replacement: production
