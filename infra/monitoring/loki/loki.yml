auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  aws:
    endpoint: ${LOKI_S3_ENDPOINT}
    region: ${LOKI_S3_REGION}
    bucketnames: ${LOKI_S3_BUCKET}
    access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
    secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
    s3forcepathstyle: ${LOKI_S3_FORCE_PATH_STYLE}
    insecure: ${LOKI_S3_INSECURE}
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: s3
  retention_delete_delay: 2h
  retention_delete_worker_count: 100

limits_config:
  retention_period: 720h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_label_names_per_series: 30
  max_streams_per_user: 0
  max_global_streams_per_user: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

chunk_store_config:
  max_look_back_period: 720h

query_range:
  align_queries_with_step: true
  cache_results: true

frontend:
  log_queries_longer_than: 5s
