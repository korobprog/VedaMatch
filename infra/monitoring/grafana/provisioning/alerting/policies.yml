apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - alertname
      - job
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email
        object_matchers:
          - - severity
            - =
            - critical
        continue: false
