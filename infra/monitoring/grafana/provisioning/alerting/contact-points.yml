apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-prod
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: ${GRAFANA_TELEGRAM_BOT_TOKEN}
          chatid: "-5194955140"
          parse_mode: HTML

  - orgId: 1
    name: email
    receivers:
      - uid: email-prod
        type: email
        disableResolveMessage: false
        settings:
          addresses: ${GRAFANA_ALERT_EMAIL_TO}
